<body>

<main class="poster">
  <header class="brand">
    <div class="true">TRUE CHOICE AUTO</div>
    <div class="warivo">
      
          <div class="true">WARIVO — Everyone's Ride</div>

    </div>
  </header>

  <section class="festival">
    <small>NAVRATRI/DUSSHERA/DIWALI</small>
    <div class="offer">
      <img class="diya" src="diya-left.png" alt="">
      <span>OFFER</span>
      <img class="diya" src="diya-right.png" alt="">
    </div>
  </section>

  <section class="discount">
    <h2>FILL IN THE DETAILS TO REDEEM YOUR DISCOUNT CODE FOR</h2>
    <strong class="percent">20% OFF</strong>
    <div class="subtitle">ON ALL RIDES</div>
  </section>

 <form id="offerForm">
    <input name="name" placeholder="Full Name" required minlength="2">
    <input name="mobile" type="tel" placeholder="Mobile Number"
      inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
    <button type="submit">Submit</button>
    <p id="message" aria-live="polite"></p>
  </form>


</main>
